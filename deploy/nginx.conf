# ==============================================================================
# NGINX PRODUCTION DOCKER CONFIGURATION CHO CỔNG THÔNG TIN ĐẠI LÝ THU BHXH SÔNG MÃ
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Thư mục chứa mã nguồn SPA đã build bên trong Nginx Container
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. KHỐI SERVICE WORKER: TUYỆT ĐỐI KHÔNG ĐƯỢC ĐỂ BỊ CACHE
    # --------------------------------------------------------------------------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires off;
    }

    # --------------------------------------------------------------------------
    # 2. KHỐI INDEX.HTML: BẮT BUỘC NO-CACHE & ĐẦY ĐỦ HEADERS BẢO MẬT CHỐNG XSS
    # --------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://api.vietqr.io; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

        expires off;
    }

    # --------------------------------------------------------------------------
    # 3. KHỐI ASSETS TĨNH (JS, CSS, HÌNH ẢNH, FONTS CÓ GẮN HASH BUILD)
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. KHỐI ĐỊNH TUYẾN SPA DỰ PHÒNG (REACT ROUTER FALLBACK)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # 5. TỐI ƯU HÓA NÉN GZIP ĐA TẦNG
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server_tokens off;
}
